title: SkyBlog
markdown: kramdown

url: "https://www.skyface.de"
baseurl: "/"

# for atom feed
author:
  name: Sebastian Joerz
  email: sjoerz@skyface.de

plugins:
  - jemoji
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections_dir: all_collections
collections:
  posts:
    output: true
  certs:
    output: true

defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:title/
exclude: ["sitemap.xml", "feed.xml", "LICENSE", "README.md"]
